<style>
/* Local defaults for an ordinary article, without Codex's visualization CSS. */
#mk61-unpacker-auto-init {
  --foreground: var(--mk61-text, CanvasText);
  --muted-foreground: color-mix(in srgb, var(--foreground) 60%, transparent);
  --viz-series-1: var(--mk61-highlight, LinkText);
  --accent: color-mix(in srgb, var(--viz-series-1) 13%, Canvas);
  --font-size-small: 12px;
  --line-height-small: 16px;
  font: 13px/1.35 system-ui, sans-serif;
}
#mk61-unpacker-auto-init * { box-sizing: border-box; }
#mk61-unpacker-auto-init .viz-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
#mk61-unpacker-auto-init .btn {
  appearance: none; padding: 4px 10px; border: 1px solid color-mix(in srgb, var(--foreground) 15%, transparent);
  border-radius: 5px; font: inherit; color: var(--foreground); background: transparent; cursor: pointer;
}
#mk61-unpacker-auto-init .btn:hover:enabled { background: color-mix(in srgb, var(--foreground) 6%, transparent); }
#mk61-unpacker-auto-init .btn:disabled { opacity: .35; cursor: default; }
#mk61-unpacker-auto-init [data-status] { padding-left: 4px; font-variant-numeric: tabular-nums; }
@media (pointer: coarse) {
  #mk61-unpacker-auto-init .btn { min-width: 44px; min-height: 44px; }
}
</style>
<div id="mk61-unpacker-auto-init">
  <div class="viz-controls">
    <button class="btn" type="button" data-back aria-label="Предыдущая команда">←</button>
    <button class="btn" type="button" data-next aria-label="Следующая команда">→</button>
    <span class="text-small tabular-nums" data-status aria-live="polite"></span>
  </div>
  <div data-program class="memory" role="list" aria-label="Программная память: ячейки 00–104"></div>
  <div class="ms-label">Ms</div>
  <div data-ms class="ms" role="list" aria-label="Девять блоков Ms по семь байтов"></div>
  <div class="ms-label">Регистры</div>
  <div data-registers class="registers" role="list" aria-label="Регистры R0–RE"></div>
  <noscript>Для пошагового просмотра нужен JavaScript.</noscript>
</div>
<style>
#mk61-unpacker-auto-init{container-type:inline-size;max-width:1000px;margin:auto;color:var(--foreground)}
#mk61-unpacker-auto-init .memory{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;margin-top:8px}
#mk61-unpacker-auto-init .cell{padding:5px 3px;min-width:0;background:color-mix(in srgb,var(--foreground) 4%,transparent);white-space:nowrap;font-size:var(--font-size-small);line-height:var(--line-height-small);font-variant-numeric:tabular-nums}
#mk61-unpacker-auto-init .cell code{font:inherit;color:inherit;margin-right:4px;padding:0;background:none}
#mk61-unpacker-auto-init .cell.target{background:color-mix(in srgb,var(--viz-series-1) 7%,transparent)}
#mk61-unpacker-auto-init .cell.pending{color:var(--muted-foreground)}
#mk61-unpacker-auto-init .cell.changed{background:color-mix(in srgb,var(--viz-series-1) 22%,transparent)}
#mk61-unpacker-auto-init .cell.current{outline:2px solid var(--viz-series-1);outline-offset:-2px;background:var(--accent);color:var(--foreground)}
#mk61-unpacker-auto-init .ms-label{font-size:var(--font-size-small);font-weight:500;margin:10px 0 4px}
#mk61-unpacker-auto-init .ms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
#mk61-unpacker-auto-init .block{padding:6px 3px;background:color-mix(in srgb,var(--foreground) 4%,transparent);font-family:ui-monospace,monospace;font-size:var(--font-size-small);line-height:var(--line-height-small);text-align:center;white-space:nowrap}
#mk61-unpacker-auto-init .block.changed{background:color-mix(in srgb,var(--viz-series-1) 16%,transparent)}
#mk61-unpacker-auto-init .service{color:var(--muted-foreground)}
#mk61-unpacker-auto-init .registers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
#mk61-unpacker-auto-init .register{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:5px 6px;min-width:0;background:color-mix(in srgb,var(--foreground) 4%,transparent);font-family:ui-monospace,monospace;font-size:var(--font-size-small);line-height:var(--line-height-small);font-variant-numeric:tabular-nums;white-space:nowrap}
#mk61-unpacker-auto-init .register-name{color:var(--muted-foreground)}
#mk61-unpacker-auto-init .register.changed{background:color-mix(in srgb,var(--viz-series-1) 16%,transparent)}
@container(max-width:850px){#mk61-unpacker-auto-init .memory{grid-template-columns:repeat(7,minmax(0,1fr))}#mk61-unpacker-auto-init .registers{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container(max-width:620px){#mk61-unpacker-auto-init .memory{grid-template-columns:repeat(5,minmax(0,1fr))}#mk61-unpacker-auto-init .ms{grid-template-columns:repeat(2,minmax(0,1fr))}#mk61-unpacker-auto-init .registers{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container(max-width:400px){#mk61-unpacker-auto-init .memory{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container(max-width:340px){#mk61-unpacker-auto-init .ms,#mk61-unpacker-auto-init .registers{grid-template-columns:1fr}}
</style>

<script>
(() => {
  const root = document.getElementById('mk61-unpacker-auto-init');
  const data = JSON.parse(document.getElementById('mk61-unpacker-auto-init-trace').textContent);
  const bytes = text => text.match(/../g).map(byte => parseInt(byte, 16));
  const memories = data.memories.map(bytes);
  const msStates = data.ms.map(bytes);
  function formatRegister(display) {
    const decimal = display.match(/^([ -])([0-9]\.[0-9]{7}) ([ -])([0-9]{2})$/);
    if(decimal) {
      const number = Number((decimal[1] === '-' ? '-' : '') + decimal[2] + 'e' +
        (decimal[3] === '-' ? '-' : '+') + decimal[4]);
      return number.toLocaleString('ru-RU', {useGrouping: false, maximumSignificantDigits: 8});
    }
    // Packed command bytes can temporarily form nondecimal mantissas.
    // Preserve the calculator's actual display symbols in those registers.
    return display.trim().replace(/ +/g, ' ');
  }
  const registerStates = data.registers.map(values => values.map(formatRegister));
  const hex = byte => byte.toString(16).toUpperCase().padStart(2, '0');
  const names = {
    0x10: '+', 0x11: '−', 0x14: 'X↔Y', 0x50: 'С/П', 0x51: 'БП',
    0x52: 'В/О', 0x54: 'НОП', 0x55: 'К ПВ', 0x56: 'К ОД',
    0x57: 'x≠0', 0x59: 'x≥0', 0x5D: 'L0', 0xBC: 'Кx→ПC'
  };
  const addressCommands = new Set([0x51, 0x53, 0x57, 0x58, 0x59, 0x5A, 0x5B, 0x5C, 0x5D, 0x5E]);
  function command(byte, address, memory, pc) {
    if(address > 0 && address !== pc && addressCommands.has(memory[address - 1])) {
      return '→' + ((byte >> 4) * 10 + (byte & 15));
    }
    if(byte <= 9) return String(byte);
    if(byte >= 0x40 && byte <= 0x4E) return 'x→П' + hex(byte).slice(1);
    if(byte >= 0x60 && byte <= 0x6E) return 'П→x' + hex(byte).slice(1);
    if(byte >= 0x80 && byte <= 0x8E) return 'КБП' + hex(byte).slice(1);
    return names[byte] || '·';
  }
  let index = 0;
  const back = root.querySelector('[data-back]');
  const next = root.querySelector('[data-next]');
  const status = root.querySelector('[data-status]');
  const program = root.querySelector('[data-program]');
  const ms = root.querySelector('[data-ms]');
  const registers = root.querySelector('[data-registers]');
  function render() {
    const [pc, memoryIndex, msIndex, registerIndex] = data.frames[index];
    const previous = data.frames[Math.max(0, index - 1)];
    const memory = memories[memoryIndex], oldMemory = memories[previous[1]];
    const currentMs = msStates[msIndex], oldMs = msStates[previous[2]];
    const registerValues = registerStates[registerIndex], oldRegisters = registerStates[previous[3]];
    status.textContent = index + ' / ' + (data.frames.length - 1);
    back.disabled = index === 0;
    next.disabled = index === data.frames.length - 1;
    program.innerHTML = memory.map((byte, address) => {
      const mnemonic = command(byte, address, memory, pc);
      const pending = address < 63 && byte === 0 && address !== pc;
      const classes = ['cell'];
      if(address < 63) classes.push('target');
      if(pending) classes.push('pending');
      if(byte !== oldMemory[address]) classes.push('changed');
      if(address === pc) classes.push('current');
      const label = 'Адрес ' + String(address).padStart(2, '0') + ', ' + hex(byte) + ' ' + mnemonic;
      return '<div role="listitem" class="' + classes.join(' ') + '" data-address="' + address +
        '" data-byte="' + hex(byte) + '" title="' + label + '" aria-label="' + label +
        '"' + (address === pc ? ' aria-current="step"' : '') + '><code>' + hex(byte) + '</code>' +
        (pending ? '' : mnemonic) + '</div>';
    }).join('');
    ms.innerHTML = Array.from({length: 9}, (_, block) => {
      const start = block * 7;
      const word = currentMs.slice(start, start + 7);
      const changed = word.some((byte, offset) => byte !== oldMs[start + offset]);
      const label = 'Блок Ms ' + block + ': ' + word.map(hex).join(' ');
      return '<div role="listitem" class="block' + (changed ? ' changed' : '') + '" data-block="' +
        block + '" data-bytes="' + word.map(hex).join('') + '" title="' + label +
        '" aria-label="' + label + '"><span class="service">' + hex(word[0]) + '</span> ' +
        word.slice(1).map(hex).join(' ') + '</div>';
    }).join('');
    registers.innerHTML = registerValues.map((value, register) => {
      const name = 'R' + register.toString(16).toUpperCase();
      const changed = value !== oldRegisters[register];
      const label = name + ' = ' + value;
      return '<div role="listitem" class="register' + (changed ? ' changed' : '') +
        '" data-register="' + register + '" data-display="' + data.registers[registerIndex][register] +
        '" title="' + label + '" aria-label="' + label + '"><span class="register-name">' +
        name + '</span><span class="register-value">' + value + '</span></div>';
    }).join('');
  }
  function move(delta) {
    const target = Math.max(0, Math.min(data.frames.length - 1, index + delta));
    if(target === index) return;
    index = target;
    render();
    if(window.openai?.setWidgetState) window.openai.setWidgetState({
      modelContent: {variant: data.variant, step: index, nextAddress: data.frames[index][0]},
      privateContent: {variant: data.variant, step: index}
    }).catch(() => {});
  }
  back.addEventListener('click', () => move(-1));
  next.addEventListener('click', () => move(1));
  root.addEventListener('keydown', event => {
    if(event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    move(event.key === 'ArrowLeft' ? -1 : 1);
  });
  function restore(state) {
    const saved = state?.privateContent;
    if(saved?.variant !== data.variant || !Number.isInteger(saved.step)) return;
    index = Math.max(0, Math.min(data.frames.length - 1, saved.step));
    render();
  }
  render();
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', event => restore(event.detail?.globals?.widgetState));
})();
</script>
