name: PicoCalc Pico H

on:
  pull_request:
    paths: ['code/**', 'ports/picocalc/**', 'third_party/fatfs/**', 'sdk/portable/**', 'examples/portable-apps/**', 'examples/loadable-apps/**', 'examples/chip8/**', 'programs/**', 'doc/explorer-icons/**', 'dev/tools/explorer_icons.py', 'tests/explorer_icons_self_test.py', 'tests/explorer_view_self_test.cpp', 'tests/run_explorer_view_tests.sh', 'doc/game-artwork/**', 'tools/**', 'dev/tools/generate_picocalc_game_assets.py', 'dev/tools/generate_highnoon_font.py', 'dev/tools/generate_ui_fonts.py', 'dev/lib/m8_codec.py', 'dev/lib/seal_picocalc.py', 'dev/tools/picocalc_cold_evidence.py', 'tests/picocalc*', 'tests/system_memcpy_arm_self_test.py', 'tests/system_memmove_arm_self_test.py', 'tests/system_memcmp_arm_self_test.py', 'tests/portable_runtime_trampoline_arm_self_test.py', 'tests/shared_memory_buffer*', 'tests/run_shared_memory_buffer_tests.sh', 'tests/wbmp_reader*', 'tests/run_wbmp_tests.sh', 'tests/fixtures/picocalc_heap_probe.cpp', 'tests/fixtures/picocalc_power_sdk.hpp', 'tests/hil_picocalc*', 'tests/portable_rust_app_arm_self_test.py', 'tests/run_portable_app_arm_tests.py', 'tests/run_picocalc*', 'tests/run_basic_graphics_tests.sh', 'tests/run_m61_text_tests.sh', 'tests/basic_graphics*', 'tests/game_manual_bind_self_test.py', 'tests/run_mkc*', 'tests/mkc_system_install_self_test.sh', 'tests/resident_firmware_format_self_test.cpp', 'tests/run_resident_firmware_format_tests.sh', 'tests/usb_screen_surface_self_test.cpp', 'tests/run_usb_screen_surface_tests.sh', '.github/workflows/picocalc.yml']
  push:
    branches: [main]
    paths: ['code/**', 'ports/picocalc/**', 'third_party/fatfs/**', 'sdk/portable/**', 'examples/portable-apps/**', 'examples/loadable-apps/**', 'examples/chip8/**', 'programs/**', 'doc/explorer-icons/**', 'dev/tools/explorer_icons.py', 'tests/explorer_icons_self_test.py', 'tests/explorer_view_self_test.cpp', 'tests/run_explorer_view_tests.sh', 'doc/game-artwork/**', 'tools/**', 'dev/tools/generate_picocalc_game_assets.py', 'dev/tools/generate_highnoon_font.py', 'dev/tools/generate_ui_fonts.py', 'dev/lib/m8_codec.py', 'dev/lib/seal_picocalc.py', 'dev/tools/picocalc_cold_evidence.py', 'tests/picocalc*', 'tests/system_memcpy_arm_self_test.py', 'tests/system_memmove_arm_self_test.py', 'tests/system_memcmp_arm_self_test.py', 'tests/portable_runtime_trampoline_arm_self_test.py', 'tests/shared_memory_buffer*', 'tests/run_shared_memory_buffer_tests.sh', 'tests/wbmp_reader*', 'tests/run_wbmp_tests.sh', 'tests/fixtures/picocalc_heap_probe.cpp', 'tests/fixtures/picocalc_power_sdk.hpp', 'tests/hil_picocalc*', 'tests/portable_rust_app_arm_self_test.py', 'tests/run_portable_app_arm_tests.py', 'tests/run_picocalc*', 'tests/run_basic_graphics_tests.sh', 'tests/run_m61_text_tests.sh', 'tests/basic_graphics*', 'tests/game_manual_bind_self_test.py', 'tests/run_mkc*', 'tests/mkc_system_install_self_test.sh', 'tests/resident_firmware_format_self_test.cpp', 'tests/run_resident_firmware_format_tests.sh', 'tests/usb_screen_surface_self_test.cpp', 'tests/run_usb_screen_surface_tests.sh', '.github/workflows/picocalc.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  picocalc:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - uses: actions/checkout@v6
      - name: Test core, files, autoexec, Markdown, fonts, RTC and diagnostics with sanitizers
        run: |
          MK61_TEST_SANITIZERS=1 bash tests/run_picocalc_tests.sh
          MK61_TEST_SANITIZERS=1 bash tests/run_usb_screen_surface_tests.sh
          MK61_TEST_SANITIZERS=1 bash tests/run_resident_firmware_format_tests.sh
          bash tests/run_mkc_tests.sh
          python3 tests/firmware_entry_self_test.py
          bash tests/mkc_system_install_self_test.sh
          MK61_TEST_SANITIZERS=1 bash tests/run_picocalc_recovery_tests.sh
          MK61_TEST_SANITIZERS=1 bash tests/run_picocalc_hardware_tests.sh
          MK61_TEST_SANITIZERS=1 bash tests/run_wbmp_tests.sh
          MK61_TEST_SANITIZERS=1 bash tests/run_basic_graphics_tests.sh
          bash tests/run_m61_text_tests.sh
          python3 tests/picocalc_version_self_test.py
          python3 tests/picocalc_cold_evidence_self_test.py
          python3 tests/picocalc_resources_ci_self_test.py
          python3 tests/picocalc_explorer_hil_self_test.py
          python3 dev/tools/explorer_icons.py --check
          python3 tests/explorer_icons_self_test.py
          MK61_TEST_SANITIZERS=1 bash tests/run_explorer_view_tests.sh
      - name: Verify reviewed native game resources and production decoders
        run: |
          python3 dev/tools/generate_picocalc_game_assets.py --check-inputs
          python3 tests/picocalc_native_assets_self_test.py
      - name: Install pinned GNU Arm compiler
        uses: ./.github/actions/setup-native-gcc
      - name: Install pinned Rust and both native APP targets
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup target add --toolchain 1.94.1 thumbv6m-none-eabi thumbv7em-none-eabihf
      - name: Build RP2040 firmware and check CPU, ABI and UF2 payload
        run: python3 tools/firmware/picocalc/build_picocalc.py --fetch-sdk
      - name: Build all seven ARMv6-M native APP examples
        run: python3 tools/apps/system/build_picocalc_apps.py
      - name: Execute packed Rust and C++ APPs on Cortex-M0 and Cortex-M4
        run: |
          python3 -m venv .build/arm-tests
          .build/arm-tests/bin/python -m pip install unicorn==2.1.4
          .build/arm-tests/bin/python tests/portable_rust_app_arm_self_test.py --output .build/arm-tests/result.json
          .build/arm-tests/bin/python tests/picocalc_heap_arm_self_test.py --json .build/arm-tests/heap.json
      - name: Verify memory operation bounds, ABI and linked Pico ROM memset bridge
        run: |
          MEMORY_TEST_TOOLCHAIN=$(python3 -c 'import sys; from tools.firmware.picocalc.build_picocalc import compiler_bin; print(compiler_bin(None))')
          .build/arm-tests/bin/python tests/system_memcpy_arm_self_test.py --arm-toolchain-bin "$MEMORY_TEST_TOOLCHAIN" --output .build/arm-tests/memcpy.json
          .build/arm-tests/bin/python tests/system_memmove_arm_self_test.py --arm-toolchain-bin "$MEMORY_TEST_TOOLCHAIN" --output .build/arm-tests/memmove.json
          .build/arm-tests/bin/python tests/system_memcmp_arm_self_test.py --arm-toolchain-bin "$MEMORY_TEST_TOOLCHAIN" --output .build/arm-tests/memcmp.json
          .build/arm-tests/bin/python tests/portable_runtime_trampoline_arm_self_test.py --arm-toolchain-bin "$MEMORY_TEST_TOOLCHAIN" --output .build/arm-tests/runtime.json
          .build/arm-tests/bin/python tests/picocalc_memory_arm_self_test.py .build/picocalc-pico-h/mk61s-picocalc-pico-h.elf --output .build/arm-tests/memory-link.json
      - name: Package clean Pico H release and verify its contents
        run: |
          python3 tools/firmware/picocalc/package_picocalc.py
          python3 tests/picocalc_package_self_test.py
      - uses: actions/upload-artifact@v7
        with:
          name: mk61s-picocalc-pico-h
          path: .build/firmware/picocalc-pico-h/
          include-hidden-files: true
          if-no-files-found: error

  stm32-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [f401-product-a00, f411-classic-v3]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-native-gcc
      - name: Build STM32 resident with its production budgets
        run: python3 tools/firmware/stm32/build-standalone.py --release-case '${{ matrix.case }}' --build-path '.build/picocalc-stm32/${{ matrix.case }}'
      - name: Build matching STM32 System APPs
        run: |
          python3 tools/apps/system/build_system_app_bundle.py \
            --resident-elf '.build/picocalc-stm32/${{ matrix.case }}/resident.elf' \
            --compile-commands '.build/picocalc-stm32/${{ matrix.case }}/compile_commands.json' \
            --output-dir '.build/picocalc-stm32/${{ matrix.case }}/System'
