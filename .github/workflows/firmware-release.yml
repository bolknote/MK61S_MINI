name: Firmware release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: 1.5.1

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run CI-strict host test suite
        run: tests/run_ci_strict.sh

  f401-gcc-platforms:
    name: F401 direct GCC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    env:
      STM32_CORE_VERSION: 2.12.0
      STM32_PACKAGE_URL: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Arduino CLI for dependency installation
        uses: ./.github/actions/setup-arduino-cli
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Install pinned STM32 packages
        shell: pwsh
        run: |
          arduino-cli config init --overwrite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          arduino-cli config set board_manager.additional_urls "$env:STM32_PACKAGE_URL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          arduino-cli core update-index
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          arduino-cli core install "STMicroelectronics:stm32@$env:STM32_CORE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          arduino-cli lib update-index
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          arduino-cli lib install "LiquidCrystal@1.0.7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          arduino-cli lib install "STM32duino RTC@1.9.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write full F401 build configuration
        shell: pwsh
        run: |
          @(
            'MCU=f401',
            'PLATFORM=mini-v3',
            'SCREEN=lcd1602-a00',
            'MK61_ENABLE_FOCAL=1',
            'MK61_ENABLE_TINYBASIC=1',
            'MK61_ENABLE_WBMP_VIEWER=0',
            'MK61_ENABLE_MARKDOWN_VIEWER=1',
            'MK61_ENABLE_CHIP8=1',
            'MK61_ENABLE_USB_SCREEN=1',
            'MK61_ENABLE_EXTENDED_FONT_SETTINGS=0',
            'MK61_USER_EXPLORER_SHORTCUT=1',
            'MK61_MATH_BACKEND=1'
          ) | Set-Content -LiteralPath (
            Join-Path $env:RUNNER_TEMP 'f401.conf') -Encoding utf8

      - name: Build through the macOS shell frontend
        if: runner.os == 'macOS'
        shell: bash
        run: |
          MK61_CONFIG_FILE="$RUNNER_TEMP/f401.conf" \
          MK61_BUILD_ROOT="$RUNNER_TEMP/f401-work" \
          MK61_OUTPUT_DIR="$RUNNER_TEMP/f401-output" \
          MK61_COLOR=never \
            ./tools/mk61-firmware.cmd \
              --mcu f401 --profile mini-v3-a00 --build

      - name: Build through the Windows PowerShell frontend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MK61_CONFIG_FILE = Join-Path $env:RUNNER_TEMP 'f401.conf'
          $env:MK61_BUILD_ROOT = Join-Path $env:RUNNER_TEMP 'f401-work'
          $env:MK61_OUTPUT_DIR = Join-Path $env:RUNNER_TEMP 'f401-output'
          $env:MK61_COLOR = 'never'
          & ./tools/mk61-firmware.cmd `
            --mcu f401 --profile mini-v3-a00 --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify resident and combined System APP
        shell: pwsh
        run: |
          $buildPath = Join-Path $env:RUNNER_TEMP `
            'f401-work/f401-gcc/mini-v3-a00'
          foreach ($name in @(
            'resident.elf',
            'resident.bin',
            'compile_commands.json'
          )) {
            $path = Join-Path $buildPath $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Missing F401 build artifact: $name"
            }
          }
          $bundle = Join-Path (
            Join-Path $env:RUNNER_TEMP 'f401-output') `
            'mk61s-M-mini-v3-lcd1602-a00-f401'
          @(
            'mk61s-M-mini-v3-lcd1602-a00-f401.bin',
            'build.flags',
            'System/FOCAL.APP',
            'System/BASIC.APP',
            'System/MARKDOWN.APP',
            'System/CHIP8.APP'
          ) | ForEach-Object {
            $path = Join-Path $bundle $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Missing F401 artifact: $_"
            }
          }
          $flags = Get-Content -LiteralPath (
            Join-Path $bundle 'build.flags') -Raw
          foreach ($required in @(
            '-DMK61_MATH_BACKEND=1',
            '-DMK61_ENABLE_LTO=1',
            '-DMK61_ENABLE_WBMP_VIEWER=0'
          )) {
            if (-not $flags.Contains($required)) {
              throw "Missing F401 build flag: $required"
            }
          }
          if (Test-Path -LiteralPath (
              Join-Path $bundle 'System/WBMP.APP')) {
            throw 'WBMP.APP must be folded into MARKDOWN.APP'
          }

  build-release:
    name: Build firmware
    needs:
      - host-tests
      - f401-gcc-platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      STM32_CORE_VERSION: 2.12.0
      STM32_PACKAGE_URL: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
      FQBN: STMicroelectronics:stm32:GenF4:pnum=BLACKPILL_F411CE,upload_method=dfuMethod,xserial=generic,usb=CDCgen,opt=osstd
      FQBN_LTO: STMicroelectronics:stm32:GenF4:pnum=BLACKPILL_F411CE,upload_method=dfuMethod,xserial=generic,usb=CDCgen,opt=o3lto

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Arduino CLI
        uses: ./.github/actions/setup-arduino-cli
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Install STM32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "$STM32_PACKAGE_URL"
          arduino-cli core update-index
          arduino-cli core install "STMicroelectronics:stm32@$STM32_CORE_VERSION"

      - name: Install Arduino libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "LiquidCrystal@1.0.7"
          arduino-cli lib install "STM32duino RTC@1.9.0"

      - name: Prepare sketch
        run: |
          mkdir -p "$RUNNER_TEMP/mk61s-M"
          cp -R code/. "$RUNNER_TEMP/mk61s-M/"
          mkdir -p firmware

      - name: Build LCD1602 A00 firmware
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --build-path "$RUNNER_TEMP/build-lcd1602-a00" \
            --build-property "compiler.cpp.extra_flags=-DMK61_LCD1602_A00" \
            "$RUNNER_TEMP/mk61s-M"
          cp "$RUNNER_TEMP/build-lcd1602-a00/mk61s-M.ino.bin" "firmware/mk61s-M-lcd1602-a00-f411-${GITHUB_SHA::7}.bin"

      - name: Compile-check LCD1602 A00 with USB Screen
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --build-path "$RUNNER_TEMP/build-lcd1602-a00-usb-screen" \
            --build-property "compiler.cpp.extra_flags=-DMK61_LCD1602_A00 -DMK61_ENABLE_USB_SCREEN=1" \
            "$RUNNER_TEMP/mk61s-M"

      # LiquidCrystal 1.0.7 определяет command() как inline только в .cpp.
      # Отдельная LTO-сборка не даёт случайно вернуть внешний вызов этого
      # отсутствующего символа из нашего LCD-транспорта.
      - name: Link-check LCD1602 A00 with LTO
        run: |
          arduino-cli compile \
            --fqbn "$FQBN_LTO" \
            --build-path "$RUNNER_TEMP/build-lcd1602-a00-lto" \
            --build-property "compiler.cpp.extra_flags=-DMK61_LCD1602_A00" \
            "$RUNNER_TEMP/mk61s-M"

      - name: Build LCD1602 A02 firmware
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --build-path "$RUNNER_TEMP/build-lcd1602-a02" \
            --build-property "compiler.cpp.extra_flags=-DMK61_LCD1602_A02" \
            "$RUNNER_TEMP/mk61s-M"
          cp "$RUNNER_TEMP/build-lcd1602-a02/mk61s-M.ino.bin" "firmware/mk61s-M-lcd1602-a02-f411-${GITHUB_SHA::7}.bin"

      - name: Build mini V2 LCD1602 A00 firmware
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --build-path "$RUNNER_TEMP/build-mini-v2-lcd1602-a00" \
            --build-property "compiler.cpp.extra_flags=-DREVISION_V2 -DMK61_LCD1602_A00" \
            "$RUNNER_TEMP/mk61s-M"
          cp "$RUNNER_TEMP/build-mini-v2-lcd1602-a00/mk61s-M.ino.bin" "firmware/mk61s-M-mini-v2-lcd1602-a00-f411-${GITHUB_SHA::7}.bin"

      - name: Build mini V2 LCD1602 A02 firmware
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --build-path "$RUNNER_TEMP/build-mini-v2-lcd1602-a02" \
            --build-property "compiler.cpp.extra_flags=-DREVISION_V2 -DMK61_LCD1602_A02" \
            "$RUNNER_TEMP/mk61s-M"
          cp "$RUNNER_TEMP/build-mini-v2-lcd1602-a02/mk61s-M.ino.bin" "firmware/mk61s-M-mini-v2-lcd1602-a02-f411-${GITHUB_SHA::7}.bin"

      - name: Build Classic V2 UC1609 firmware
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --build-path "$RUNNER_TEMP/build-classic-v2" \
            --build-property "compiler.cpp.extra_flags=-DMK61_BOARD_CLASSIC_V2" \
            "$RUNNER_TEMP/mk61s-M"
          cp "$RUNNER_TEMP/build-classic-v2/mk61s-M.ino.bin" "firmware/mk61s-M-classic-v2-uc1609-f411-${GITHUB_SHA::7}.bin"

      - name: Build Classic V3 UC1609 firmware
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --build-path "$RUNNER_TEMP/build-classic-v3" \
            --build-property "compiler.cpp.extra_flags=-DMK61_BOARD_CLASSIC_V3" \
            "$RUNNER_TEMP/mk61s-M"
          cp "$RUNNER_TEMP/build-classic-v3/mk61s-M.ino.bin" "firmware/mk61s-M-classic-v3-uc1609-f411-${GITHUB_SHA::7}.bin"

      - name: Compile-check Classic V3 UC1609 with USB Screen
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --build-path "$RUNNER_TEMP/build-classic-v3-usb-screen" \
            --build-property "compiler.cpp.extra_flags=-DMK61_BOARD_CLASSIC_V3 -DMK61_ENABLE_USB_SCREEN=1" \
            "$RUNNER_TEMP/mk61s-M"

      - name: Build MK61s 40th firmware
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --build-path "$RUNNER_TEMP/build-40th" \
            --build-property "compiler.cpp.extra_flags=-DMK61_BOARD_40TH" \
            "$RUNNER_TEMP/mk61s-M"
          cp "$RUNNER_TEMP/build-40th/mk61s-M.ino.bin" "firmware/mk61s-M-40th-f411-${GITHUB_SHA::7}.bin"

      - name: Build STM32F401CC firmware and System APP directly with GCC
        run: |
          for profile in mini-v3-a00 mini-v2-a00; do
            tools/build-gcc.cmd \
              -Profile "$profile" \
              -Focal 1 \
              -Basic 1 \
              -Wbmp 0 \
              -Markdown 1 \
              -Chip8 0 \
              -UsbScreen 0 \
              -MathBackend 1 \
              -Lto 1 \
              -BuildRoot "$RUNNER_TEMP/build-f401-gcc" \
              -OutputDirectory firmware
          done

      - name: Check pre-setup constructors
        run: |
          for elf in "$RUNNER_TEMP"/build-*/mk61s-M.ino.elf; do
            tests/check_global_constructors.sh "$elf"
          done
          for profile in mini-v3-a00 mini-v2-a00; do
            tests/check_global_constructors.sh \
              "$RUNNER_TEMP/build-f401-gcc/$profile/resident.elf"
          done

      - name: Verify and package F401 bundles
        run: |
          cd firmware
          for revision in v3 v2; do
            bundle="mk61s-M-mini-$revision-lcd1602-a00-f401"
            for artifact in \
              "$bundle/$bundle.bin" \
              "$bundle/build.flags" \
              "$bundle/build.apps" \
              "$bundle/System/FOCAL.APP" \
              "$bundle/System/BASIC.APP" \
              "$bundle/System/MARKDOWN.APP"; do
              if [ ! -s "$artifact" ]; then
                echo "Missing F401 release artifact: $artifact" >&2
                exit 1
              fi
            done
            for disabled in \
              "$bundle/System/WBMP.APP" \
              "$bundle/System/CHIP8.APP"; do
              if [ -e "$disabled" ]; then
                echo "Unexpected disabled F401 APP: $disabled" >&2
                exit 1
              fi
            done
            grep -F -- '-DMK61_MATH_BACKEND=1' "$bundle/build.flags"
            grep -F -- '-DMK61_ENABLE_LTO=1' "$bundle/build.flags"
            markdown_size=$(stat -c %s "$bundle/System/MARKDOWN.APP")
            if [ "$markdown_size" -gt 4096 ]; then
              echo "Plain MARKDOWN.APP exceeds 4 KiB: $markdown_size" >&2
              exit 1
            fi
            zip -qr "$bundle.zip" "$bundle"
          done
          find . -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mk61s-firmware-${{ github.sha }}
          path: firmware/*
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: firmware-${{ github.run_number }}-${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            firmware/*.bin firmware/*.zip firmware/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Firmware ${GITHUB_SHA::7}" \
            --notes "Automated firmware build for ${GITHUB_SHA}."
