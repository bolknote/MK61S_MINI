name: Firmware release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run CI-strict host test suite
        run: tests/run_ci_strict.sh

  f401-gcc-platforms:
    name: F401 direct GCC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test build gates on the native host
        shell: pwsh
        run: |
          python3 tests/check_stack_usage_self_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 tests/analyze_stack_usage_self_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 tests/flash_budget_self_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup Arduino CLI for dependency installation
        uses: ./.github/actions/setup-arduino-cli

      - name: Install pinned STM32 packages
        shell: pwsh
        run: tools/install_arduino_dependencies.ps1

      - name: Write full F401 build configuration
        shell: pwsh
        run: |
          @(
            'MCU=f401',
            'PLATFORM=mini-v3',
            'SCREEN=lcd1602-a00',
            'MK61_ENABLE_FOCAL=1',
            'MK61_ENABLE_TINYBASIC=1',
            'MK61_ENABLE_WBMP_VIEWER=0',
            'MK61_ENABLE_MARKDOWN_VIEWER=1',
            'MK61_ENABLE_CHIP8=1',
            'MK61_ENABLE_USB_SCREEN=1',
            'MK61_ENABLE_LOADABLE_MODULES=1',
            'MK61_ENABLE_EXTENDED_FONT_SETTINGS=0',
            'MK61_USER_EXPLORER_SHORTCUT=1',
            'MK61_MATH_BACKEND=1'
          ) | Set-Content -LiteralPath (
            Join-Path $env:RUNNER_TEMP 'f401.conf') -Encoding utf8

      - name: Build through the macOS shell frontend
        if: runner.os == 'macOS'
        shell: bash
        run: |
          MK61_CONFIG_FILE="$RUNNER_TEMP/f401.conf" \
          MK61_BUILD_ROOT="$RUNNER_TEMP/f401-work" \
          MK61_OUTPUT_DIR="$RUNNER_TEMP/f401-output" \
          MK61_COLOR=never \
            ./tools/mk61-firmware.cmd \
              --mcu f401 --profile mini-v3-a00 --build

      - name: Build through the Windows PowerShell frontend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MK61_CONFIG_FILE = Join-Path $env:RUNNER_TEMP 'f401.conf'
          $env:MK61_BUILD_ROOT = Join-Path $env:RUNNER_TEMP 'f401-work'
          $env:MK61_OUTPUT_DIR = Join-Path $env:RUNNER_TEMP 'f401-output'
          $env:MK61_COLOR = 'never'
          & ./tools/mk61-firmware.cmd `
            --mcu f401 --profile mini-v3-a00 --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify resident and combined System APP
        shell: pwsh
        run: |
          $buildPath = Join-Path $env:RUNNER_TEMP `
            'f401-work/f401-gcc/mini-v3-a00'
          foreach ($name in @(
            'resident.elf',
            'resident.bin',
            'compile_commands.json'
          )) {
            $path = Join-Path $buildPath $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Missing F401 build artifact: $name"
            }
          }
          & ./tools/seal-firmware.ps1 check `
            -InputFile (Join-Path $buildPath 'resident.bin') `
            -MaxSize 262144
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = Join-Path (
            Join-Path $env:RUNNER_TEMP 'f401-output') `
            'mk61s-M-mini-v3-lcd1602-a00-f401'
          @(
            'mk61s-M-mini-v3-lcd1602-a00-f401.bin',
            'build.flags',
            'System/FOCAL.APP',
            'System/BASIC.APP',
            'System/MARKDOWN.APP',
            'System/CHIP8.APP',
            'System/SETUP.APP',
            'System/HELP0.TXT',
            'System/HELP1.TXT'
          ) | ForEach-Object {
            $path = Join-Path $bundle $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Missing F401 artifact: $_"
            }
            if ($_.EndsWith('.APP', [StringComparison]::OrdinalIgnoreCase)) {
              [byte[]]$container = [IO.File]::ReadAllBytes($path)
              if ($container.Length -le 64 -or $container[15] -ne 1) {
                throw "F401 APP is not packed with ZX0: $_"
              }
              if ([BitConverter]::ToUInt16($container, 12) -ne 5 -or
                  [BitConverter]::ToUInt32($container, 16) -notin @(5, 7)) {
                throw "F401 APP is not current relocatable ABI 5: $_"
              }
            }
          }
          $flags = Get-Content -LiteralPath (
            Join-Path $bundle 'build.flags') -Raw
          foreach ($required in @(
            '-DMK61_MATH_BACKEND=1',
            '-DMK61_ENABLE_LTO=1',
            '-DMK61_ENABLE_LOADABLE_MODULES=1',
            '-DMK61_ENABLE_WBMP_VIEWER=0'
          )) {
            if (-not $flags.Contains($required)) {
              throw "Missing F401 build flag: $required"
            }
          }
          if (Test-Path -LiteralPath (
              Join-Path $bundle 'System/WBMP.APP')) {
            throw 'WBMP.APP must be folded into MARKDOWN.APP'
          }

  arduino-ide-windows:
    name: Windows Arduino IDE recipe (no host C++)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Arduino CLI
        uses: ./.github/actions/setup-arduino-cli

      - name: Install pinned STM32 packages
        shell: pwsh
        run: tools/install_arduino_dependencies.ps1

      - name: Install MK61 Arduino board
        shell: pwsh
        run: |
          & ./tools/mk61-arduino-board.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Arduino IDE 2.x and arduino-cli execute the same boards.txt/platform.txt
      # recipes. Deliberately poison MK61_HOST_CXX: this proves that a normal
      # Windows IDE installation needs only Python, not Visual Studio/MinGW.
      - name: Compile complete F401 mini V2 bundle through the Arduino IDE recipe
        shell: pwsh
        run: |
          $env:MK61_HOST_CXX = Join-Path $env:RUNNER_TEMP 'missing-host-cxx.exe'
          if (Test-Path -LiteralPath $env:MK61_HOST_CXX) {
            throw 'The negative host-compiler sentinel unexpectedly exists'
          }
          $bundleName = 'mk61s-M-mini-v2-lcd1602-a00-f401'
          $buildPath = Join-Path $env:RUNNER_TEMP 'arduino-ide-f401-mini-v2'
          & arduino-cli compile `
            --fqbn 'mk61:stm32:mk61_f401_app:mk61_platform=mini_v2,mk61_display=lcd_a00,mk61_focal=enabled,mk61_basic=enabled,mk61_documents=markdown,mk61_chip8=disabled,mk61_usb_screen=disabled,mk61_font_settings=disabled,mk61_explorer=enabled,mk61_math=core' `
            --build-path $buildPath code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($name in @('code.ino.elf', 'code.ino.bin')) {
            $artifact = Join-Path $buildPath $name
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf) -or
                (Get-Item -LiteralPath $artifact).Length -eq 0) {
              throw "Arduino IDE recipe did not produce $name"
            }
          }

          $bundle = Join-Path $env:GITHUB_WORKSPACE "binary/$bundleName"
          foreach ($name in @(
            "$bundleName.bin",
            'build.flags',
            'build.apps',
            'System/HELP0.TXT',
            'System/HELP1.TXT'
          )) {
            $artifact = Join-Path $bundle $name
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf) -or
                (Get-Item -LiteralPath $artifact).Length -eq 0) {
              throw "Arduino IDE V2 bundle did not produce $name"
            }
          }

          $expectedKinds = @{
            'FOCAL.APP' = 1
            'BASIC.APP' = 2
            'MARKDOWN.APP' = 6
            'SETUP.APP' = 7
          }
          foreach ($entry in $expectedKinds.GetEnumerator()) {
            $artifact = Join-Path $bundle "System/$($entry.Key)"
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Arduino IDE V2 bundle did not produce System/$($entry.Key)"
            }
            [byte[]]$container = [IO.File]::ReadAllBytes($artifact)
            if ($container.Length -le 64 -or $container.Length -gt 20544 -or
                [Text.Encoding]::ASCII.GetString($container, 0, 7) -ne 'MK61APP' -or
                $container[7] -ne 0 -or
                [BitConverter]::ToUInt16($container, 12) -ne 5 -or
                $container[14] -ne $entry.Value -or $container[15] -ne 1) {
              throw "System/$($entry.Key) is not the expected packed ABI 5 APP"
            }
          }

          foreach ($name in @('WBMP.APP', 'CHIP8.APP')) {
            if (Test-Path -LiteralPath (Join-Path $bundle "System/$name")) {
              throw "Arduino IDE V2 bundle contains disabled System/$name"
            }
          }

          $flags = Get-Content -LiteralPath (Join-Path $bundle 'build.flags') -Raw
          foreach ($required in @(
            '-DREVISION_V2',
            '-DMK61_ENABLE_LOADABLE_MODULES=1',
            '-DMK61_ENABLE_FOCAL=1',
            '-DMK61_ENABLE_TINYBASIC=1',
            '-DMK61_ENABLE_WBMP_VIEWER=0',
            '-DMK61_ENABLE_MARKDOWN_VIEWER=1',
            '-DMK61_ENABLE_CHIP8=0',
            '-DMK61_MATH_BACKEND=1',
            '-DMK61_APP_LOCAL_FLOAT_MATH=0',
            '-DMK61_PORTABLE_UI_FONTS=0'
          )) {
            if (-not $flags.Contains($required)) {
              throw "Arduino IDE V2 bundle is missing build flag: $required"
            }
          }

  build-release:
    name: Build firmware
    needs:
      - host-tests
      - f401-gcc-platforms
      - arduino-ide-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Arduino CLI
        uses: ./.github/actions/setup-arduino-cli

      - name: Install pinned STM32 packages
        shell: pwsh
        run: tools/install_arduino_dependencies.ps1

      # This is the same entry point developers run locally. It compiles all
      # F411 release/check matrix with warnings-as-errors, checks the
      # warning allowlist and rejects project-owned pre-setup constructors.
      - name: Build strict STM32F411 release matrix
        run: |
          MK61_F411_BUILD_ROOT="$RUNNER_TEMP/f411-release" \
          MK61_FIRMWARE_OUTPUT_DIR="$GITHUB_WORKSPACE/firmware" \
          MK61_FIRMWARE_TAG="${GITHUB_SHA::7}" \
            tests/run_f411_release_matrix.sh

      - name: Verify STM32F411 mixed O3 compatibility
        run: |
          MK61_F411_O3_BUILD_ROOT="$RUNNER_TEMP/f411-o3" \
            tests/run_f411_o3_compile_check.sh

      - name: Verify direct Arduino stock-linker compatibility
        run: |
          MK61_STOCK_LINKER_BUILD_ROOT="$RUNNER_TEMP/stock-linker" \
            tests/run_stock_linker_compile_check.sh

      - name: Compile-check F401 Classic V3 UC1609 through Arduino
        run: |
          MK61_F401_UC1609_BUILD_ROOT="$RUNNER_TEMP/f401-arduino-uc1609" \
            tests/run_f401_uc1609_compile_check.sh

      - name: Build, verify and package contract-driven F401 matrix
        env:
          MK61_F401_MATRIX_ROOT: ${{ runner.temp }}/f401-release
          MK61_F411_MATRIX_ROOT: ${{ runner.temp }}/f411-release
          MK61_FIRMWARE_OUTPUT_DIR: ${{ github.workspace }}/firmware
          MK61_PACKAGE_RELEASE: '1'
        run: tests/run_f401_release_matrix.sh

      - name: Write release checksums
        run: |
          test -s firmware/UI_FONT_LICENSES.zip
          python3 tools/release_contract.py aggregate-reports \
            --reports-below "$RUNNER_TEMP/f411-release" \
            --reports-below "$RUNNER_TEMP/f401-arduino-uc1609" \
            --reports-below "$RUNNER_TEMP/f401-release" \
            --output-prefix firmware/RESOURCE_REPORT
          cd firmware
          find . -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mk61s-firmware-${{ github.sha }}
          path: firmware/*
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: firmware-${{ github.run_number }}-${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            firmware/*.bin firmware/*.zip firmware/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Firmware ${GITHUB_SHA::7}" \
            --notes "Automated firmware build for ${GITHUB_SHA}. UI font license notices accompany the F411 binaries in UI_FONT_LICENSES.zip."
