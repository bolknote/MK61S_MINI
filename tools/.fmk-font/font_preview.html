<div id="mk61-font-study" aria-label="Сравнение шрифтов UC1609 и WS0010">
  <style>
    #mk61-font-study { --study-ink: light-dark(#24312f, #e0e8e5); --study-rule: light-dark(#b6c5bd, #50635b); color: var(--study-ink); }
    #mk61-font-study .screens { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 20px 0; }
    #mk61-font-study figure { margin: 0; min-width: 0; }
    #mk61-font-study figcaption { margin-bottom: 8px; }
    #mk61-font-study .lcd { display: block; width: 384px; max-width: 100%; height: auto; image-rendering: pixelated; }
    #mk61-font-study .native { display: block; width: 192px; height: 64px; margin-top: 10px; image-rendering: pixelated; }
    #mk61-font-study .ws { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    #mk61-font-study details { margin-top: 20px; border-top: 1px solid var(--study-rule); padding-top: 12px; }
    #mk61-font-study summary { cursor: pointer; }
    #mk61-font-study .detail { margin-top: 10px; }
    @media(max-width: 820px) { #mk61-font-study .screens { grid-template-columns: 1fr; } }
  </style>
  <div class="viz-controls">
    <label class="form-label">Шрифт<select class="form-select" data-choice="family"><option value="dejavu">DejaVu Sans</option><option value="roboto">Roboto Regular</option></select></label>
    <label class="form-label">Предел высоты растра<select class="form-select" data-choice="height"><option value="8">8 px</option><option value="10">10 px</option><option value="12">12 px</option><option value="14" selected>14 px</option></select></label>
    <label class="form-label">Содержимое<select class="form-select" data-choice="scene"><option value="menu">Меню</option><option value="english">Меню EN</option><option value="settings">Настройки</option><option value="files">Файлы</option><option value="manual">Инструкция</option><option value="stress">Кириллица: стресс-тест</option></select></label>
  </div>
  <div class="screens">
    <figure><figcaption>Текущий 5×8 · фиксированная сетка</figcaption><canvas class="lcd" data-screen="old" width="192" height="64" aria-label="Текущий фиксированный шрифт, увеличение 2×"></canvas><canvas class="native" data-screen="old-native" width="192" height="64" aria-label="Текущий шрифт 1:1 в CSS-пикселях"></canvas></figure>
    <figure><figcaption data-label="new">Пропорциональный шрифт</figcaption><canvas class="lcd" data-screen="new" width="192" height="64" aria-label="Предлагаемый шрифт, увеличение 2×"></canvas><canvas class="native" data-screen="new-native" width="192" height="64" aria-label="Предлагаемый шрифт 1:1 в CSS-пикселях"></canvas></figure>
  </div>
  <div class="detail" data-label="metrics" aria-live="polite"></div>
  <details><summary>WS0010 · влияние зазоров между знакоместами</summary>
    <div class="screens">
      <figure><figcaption>Сплошная сетка 80×16 · выбранный шрифт</figcaption><canvas class="ws" data-screen="ws-flat" width="80" height="16" aria-label="WS0010 без физических зазоров"></canvas></figure>
      <figure><figcaption>Физическая геометрия WEH001602A</figcaption><canvas class="ws" data-screen="ws-real" width="1139" height="237" aria-label="WS0010 с зазорами между группами по пять столбцов и восемь строк"></canvas></figure>
    </div>
  </details>
  <script>
  (() => {
    const root = document.getElementById('mk61-font-study');
    const data = __FONT_STUDY_DATA__;
    const state = { family: 'dejavu', height: '14', scene: 'menu', gap: 2, inverse: false };
    const canvas = name => root.querySelector('[data-screen="' + name + '"]');
    const label = name => root.querySelector('[data-label="' + name + '"]');
    function pixel(row, x) { return (parseInt(row[Math.floor(x / 4)], 16) >> (3 - x % 4)) & 1; }
    function paint(target, rows, oled = false) {
      const ctx = target.getContext('2d');
      ctx.fillStyle = oled ? '#101810' : '#143555';
      ctx.fillRect(0, 0, target.width, target.height);
      ctx.fillStyle = oled ? '#73ff87' : '#dcf1f3';
      rows.forEach((row, y) => { for (let x = 0; x < target.width; x++) if (pixel(row, x)) ctx.fillRect(x, y, 1, 1); });
    }
    function render() {
      const font = data.fonts[state.family + '-' + state.height];
      const frame = font.frames[state.scene + '-' + state.gap + '-' + Number(state.inverse)];
      const old = data.baseline[state.scene];
      paint(canvas('old'), old.pixels); paint(canvas('old-native'), old.pixels);
      paint(canvas('new'), frame.pixels); paint(canvas('new-native'), frame.pixels);
      label('new').textContent = font.family + ' · ' + font.height + ' px растр / ' + font.ppem + ' ppem';
      label('metrics').textContent = frame.rows + ' строк · межстрочный просвет ' + state.gap + ' px · ' + frame.truncated_lines + ' строк с многоточием' + (font.missing.length ? ' · отсутствуют: ' + String.fromCodePoint(...font.missing) : ' · все 169 символов присутствуют');
      [canvas('new'), canvas('new-native')].forEach(c => c.setAttribute('aria-label', frame.visible.join('; ')));
      [canvas('old'), canvas('old-native')].forEach(c => c.setAttribute('aria-label', old.visible.join('; ')));
      const ws = data.ws[state.family + '-' + state.height]; paint(canvas('ws-flat'), ws.pixels, true);
      const ctx = canvas('ws-real').getContext('2d');
      ctx.fillStyle = '#101810'; ctx.fillRect(0, 0, 1139, 237); ctx.fillStyle = '#73ff87';
      ws.pixels.forEach((row, y) => { for (let x = 0; x < 80; x++) if (pixel(row, x)) ctx.fillRect(12*x + 12*Math.floor(x/5), 14*y + 14*Math.floor(y/8), 11, 13); });
    }
    root.querySelectorAll('[data-choice]').forEach(select => select.addEventListener('change', () => { state[select.dataset.choice] = select.value; render(); }));
    render();
    if (globalThis.Tweak) {
      const tweak = new Tweak({container: root, onChange: render});
      tweak.addSlider(state, 'gap', {label: 'Межстрочный просвет', min: 1, max: 3, step: 1, unit: 'px'});
      tweak.addToggle(state, 'inverse', {label: 'Инверсия выбранной строки'});
    }
  })();
  </script>
</div>
